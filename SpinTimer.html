<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SpinTimer</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SpinTimer">
<meta name="theme-color" content="#0a0a0a">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='24' fill='%230a0a0a'/%3E%3Ccircle cx='96' cy='96' r='56' fill='none' stroke='%23e8f53d' stroke-width='8'/%3E%3Ccircle cx='96' cy='96' r='12' fill='%23e8f53d'/%3E%3C/svg%3E">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Bebas+Neue&display=swap');

:root {
  --bg: #0a0a0a;
  --surface: #141414;
  --border: #2a2a2a;
  --accent: #e8f53d;
  --text: #f0f0f0;
  --muted: #666;
  --warm: #ff8c42;
  --cool: #42b8ff;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Mono', monospace;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
}

#setup-screen {
  width: 100%;
  max-width: 420px;
  padding: 32px 24px 48px;
  display: flex;
  flex-direction: column;
}

.app-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 52px;
  letter-spacing: 4px;
  color: var(--accent);
  line-height: 1;
  margin-bottom: 4px;
}

.app-sub {
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 40px;
}

.section-label {
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
  margin-top: 28px;
}

.input-row { display: flex; gap: 12px; }

.input-block {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  position: relative;
}

.input-block label {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 1px;
  text-transform: uppercase;
}

.input-block input[type="number"] {
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: 28px;
  font-weight: 500;
  width: 100%;
  -moz-appearance: textfield;
}

.input-block input::-webkit-outer-spin-button,
.input-block input::-webkit-inner-spin-button { -webkit-appearance: none; }

.input-block .unit {
  font-size: 11px;
  color: var(--muted);
  position: absolute;
  right: 14px;
  bottom: 14px;
}

.input-block.highlight { border-color: var(--accent); }

.ramp-viz { width: 100%; height: 60px; margin-top: 10px; opacity: 0.8; }

.beat-toggle { display: flex; gap: 8px; margin-top: 10px; }

.beat-btn {
  flex: 1;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  letter-spacing: 1px;
  cursor: pointer;
}

.beat-btn.active {
  border-color: var(--accent);
  background: rgba(232,245,61,0.08);
  color: var(--accent);
}

.start-btn {
  margin-top: 36px;
  width: 100%;
  padding: 20px;
  background: var(--accent);
  color: #0a0a0a;
  border: none;
  border-radius: 8px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px;
  letter-spacing: 4px;
  cursor: pointer;
}

.start-btn:active { opacity: 0.85; }

#workout-screen {
  display: none;
  width: 100%;
  max-width: 420px;
  flex-direction: column;
  min-height: 100svh;
}

/* 縦向き時はleft/rightペインを無効化して縦積みに */
@media (orientation: portrait) {
  .workout-left, .workout-right,
  .setup-left, .setup-right {
    display: contents;
  }
}

.workout-header {
  padding: 24px 24px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.phase-badge {
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  padding: 6px 12px;
  border-radius: 100px;
  border: 1px solid;
}

.phase-badge.warmup   { border-color: var(--warm); color: var(--warm); }
.phase-badge.peak     { border-color: var(--accent); color: var(--accent); }
.phase-badge.cooldown { border-color: var(--cool); color: var(--cool); }

.elapsed-small { font-size: 11px; color: var(--muted); letter-spacing: 1px; }

.rpm-display {
  padding: 16px 24px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.rpm-label { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }

.rpm-number {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 120px;
  line-height: 1;
  letter-spacing: -2px;
  transition: color 0.5s;
}

.rpm-sub { font-size: 11px; color: var(--muted); letter-spacing: 1px; margin-top: -8px; }

.beat-ring-wrap { display: flex; justify-content: center; padding: 24px 0 8px; }

.beat-ring {
  width: 360px;
  height: 360px;
  border-radius: 50%;
  border: 6px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

.beat-ring::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: var(--accent);
  opacity: 0;
  transform: scale(0.3);
}

.beat-ring.pulse { animation: beatPulse 0.25s ease-out forwards; }

.orbit-ring {
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  background: conic-gradient(var(--accent) 0deg, var(--accent) 0deg, transparent 0deg);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 20px), black calc(100% - 20px));
  mask: radial-gradient(farthest-side, transparent calc(100% - 20px), black calc(100% - 20px));
  pointer-events: none;
}

@keyframes beatPulse {
  0%   { background: rgba(232,245,61,0.25); border-color: var(--accent); }
  30%  { background: rgba(232,245,61,0.08); border-color: var(--accent); }
  100% { background: transparent; border-color: var(--border); }
}

.progress-section {
  padding: 16px 24px;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.time-remaining {
  text-align: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 48px;
  letter-spacing: 2px;
}

.time-label {
  text-align: center;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-top: -8px;
  margin-bottom: 8px;
}

.ramp-bar-wrap { width: 100%; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }

.ramp-bar { height: 100%; border-radius: 4px; transition: width 0.5s, background 0.5s; background: var(--accent); }

.phase-grid { display: flex; gap: 8px; margin-top: 4px; }

.phase-block {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.phase-block .ph-label { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.phase-block .ph-val { font-size: 20px; font-family: 'Bebas Neue', sans-serif; letter-spacing: 1px; }
.phase-block.active-phase { border-color: var(--accent); background: rgba(232,245,61,0.06); }

.controls { padding: 16px 24px 32px; display: flex; gap: 12px; }

.ctrl-btn {
  flex: 1;
  padding: 18px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  letter-spacing: 3px;
  cursor: pointer;
}

.ctrl-btn:active { opacity: 0.7; }
.ctrl-btn.stop { border-color: #ff4444; color: #ff4444; background: rgba(255,68,68,0.06); flex: 0.6; }

.finish-screen {
  display: none;
  width: 100%;
  max-width: 420px;
  padding: 48px 24px;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 12px;
}

.finish-icon { font-size: 64px; margin-bottom: 8px; }

.finish-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 48px;
  letter-spacing: 4px;
  color: var(--accent);
}

.finish-stats { display: flex; gap: 16px; margin-top: 16px; width: 100%; }

.finish-stat { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
.finish-stat .f-val { font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: var(--accent); }
.finish-stat .f-label { font-size: 9px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-top: 4px; }

.finish-again {
  margin-top: 24px;
  width: 100%;
  padding: 18px;
  background: var(--accent);
  color: #0a0a0a;
  border: none;
  border-radius: 8px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 24px;
  letter-spacing: 4px;
  cursor: pointer;
}

#history-screen {
  display: none;
  width: 100%;
  max-width: 420px;
  padding: 32px 24px 48px;
  flex-direction: column;
}

.hist-title { font-family: 'Bebas Neue', sans-serif; font-size: 36px; letter-spacing: 3px; color: var(--accent); margin-bottom: 4px; }
.hist-back { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); cursor: pointer; margin-bottom: 28px; }
.hist-empty { color: var(--muted); font-size: 13px; text-align: center; margin-top: 60px; }

.hist-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.hist-date { font-size: 11px; color: var(--muted); }
.hist-info { font-size: 14px; color: var(--text); margin-top: 4px; }
.hist-rpm  { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: var(--accent); }
.hist-rpmlabel { font-size: 10px; color: var(--muted); text-align: right; }

.nav-link {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
}

/* ─── LANDSCAPE ─── */
@media (orientation: landscape) {
  #workout-screen {
    flex-direction: row !important;
    min-height: 100svh;
    max-width: 100%;
    width: 100%;
    align-items: stretch;
  }

  /* 左ペイン：RPM */
  .workout-left {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 16px 8px 16px 16px;
    border-right: 1px solid var(--border);
  }

  /* 右ペイン：残り時間・コントロール */
  .workout-right {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 12px 16px 12px 12px;
  }

  .rpm-display { padding: 0; }
  .rpm-number  { font-size: 96px; }

  .beat-ring-wrap { padding: 8px 0; }
  .beat-ring { width: 300px; height: 300px; }

  .workout-header { padding: 0 0 8px 0; }

  .time-remaining { font-size: 36px; }

  .progress-section {
    padding: 0;
    gap: 8px;
    flex: 1;
  }

  .phase-grid { gap: 6px; }
  .phase-block { padding: 6px 10px; }
  .phase-block .ph-val { font-size: 16px; }

  .controls { padding: 8px 0 0 0; gap: 8px; }
  .ctrl-btn { padding: 12px; font-size: 18px; }

  .volume-row { margin: 4px 0 0 0 !important; padding: 10px 12px; }
}

@media (orientation: landscape) {
  #setup-screen {
    flex-direction: row !important;
    max-width: 100%;
    width: 100%;
    padding: 16px;
    gap: 16px;
    align-items: flex-start;
  }

  .setup-left, .setup-right {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .setup-right .section-label:first-child {
    margin-top: 0 !important;
  }

  .app-title { font-size: 36px; margin-bottom: 2px; }
  .app-sub   { margin-bottom: 16px; }
  .section-label { margin-top: 16px; }

  .start-btn { margin-top: 20px; padding: 16px; font-size: 22px; }
  .ramp-viz  { height: 48px; }
}

.volume-row {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
}

.vol-icon { font-size: 16px; }

.vol-val {
  font-size: 13px;
  color: var(--muted);
  min-width: 28px;
  text-align: right;
}

input[type="range"] {
  flex: 1;
  -webkit-appearance: none;
  height: 4px;
  border-radius: 2px;
  background: var(--border);
  outline: none;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
}

.hist-card-wrap {
  position: relative;
  overflow: hidden;
  border-radius: 8px;
  margin-bottom: 10px;
}

.hist-delete-bg {
  position: absolute;
  right: 0;
  top: 0;
  bottom: 0;
  width: 0;
  background: #ff4444;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
  overflow: hidden;
  transition: width 0.2s ease;
  cursor: pointer;
}

.hist-card-wrap.swiped .hist-delete-bg {
  width: 80px;
}

.hist-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: relative;
  transition: transform 0.2s ease;
  touch-action: pan-y;
  user-select: none;
}

.hist-card-wrap.swiped .hist-card { transform: translateX(-80px); }

.clear-all-btn {
  width: 100%;
  margin-top: 20px;
  padding: 14px;
  border-radius: 8px;
  border: 1px solid #ff4444;
  background: rgba(255,68,68,0.06);
  color: #ff4444;
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
}

.confirm-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 100;
  align-items: center;
  justify-content: center;
}

.confirm-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 28px 24px;
  margin: 24px;
  text-align: center;
}

.confirm-box p {
  font-size: 14px;
  color: var(--text);
  margin-bottom: 20px;
  line-height: 1.6;
}

.confirm-btns { display: flex; gap: 12px; }

.confirm-ok {
  flex: 1;
  padding: 14px;
  border-radius: 8px;
  border: none;
  background: #ff4444;
  color: white;
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  cursor: pointer;
}

.confirm-cancel {
  flex: 1;
  padding: 14px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  cursor: pointer;
}
</style>
</head>

function toLogVolume(val) {
  // 対数カーブ: スライダー0-100 → gain 0-1（小さい値の変化をなめらかに）
  if (val <= 0) return 0;
  return Math.pow(val / 100, 2.5);
}

function updateVolume(val) {
  beatVolume = toLogVolume(val);
  document.getElementById('volVal').textContent = val;
  document.getElementById('beatVolumeW').value = val;
  document.getElementById('volValW').textContent = val;
  localStorage.setItem('beatVolume', val);
}

function updateVolumeW(val) {
  beatVolume = toLogVolume(val);
  document.getElementById('volValW').textContent = val;
  document.getElementById('beatVolume').value = val;
  document.getElementById('volVal').textContent = val;
  localStorage.setItem('beatVolume', val);
}

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  var buf = audioCtx.createBuffer(1, 1, 22050);
  var src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.connect(audioCtx.destination);
  src.start(0);
}

function selectBeat(btn) {
  // セットアップ画面のボタン同期
  document.querySelectorAll('#setup-screen .beat-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  beatMode = btn.dataset.val;
  // ワークアウト画面のボタンも同期
  document.querySelectorAll('#beatToggleW .beat-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.val === beatMode);
  });
  initAudio();
  if (beatMode !== 'off') {
    playSound();
    setTimeout(playSound, 400);
  }
}

function selectBeatW(btn) {
  document.querySelectorAll('#beatToggleW .beat-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  beatMode = btn.dataset.val;
  // セットアップ画面のボタンも同期
  document.querySelectorAll('#setup-screen .beat-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.val === beatMode);
  });
}

function getRpmAt(sec, c) {
  var endR = c.endRpm !== undefined ? c.endRpm : c.startRpm;
  if (sec <= c.warmSec) {
    var t = sec / c.warmSec;
    return c.startRpm + (c.peakRpm - c.startRpm) * (t * t);
  } else if (sec <= c.warmSec + c.peakSec) {
    return c.peakRpm;
  } else {
    var t2 = (sec - c.warmSec - c.peakSec) / c.coolSec;
    return c.peakRpm - (c.peakRpm - endR) * (1 - (1 - t2) * (1 - t2));
  }
}

function drawRamp() {
  var canvas = document.getElementById('rampCanvas');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth * window.devicePixelRatio;
  canvas.height = canvas.offsetHeight * window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  var W = canvas.offsetWidth, H = canvas.offsetHeight;
  var total = +document.getElementById('totalMin').value * 60;
  var warm  = +document.getElementById('warmMin').value * 60;
  var cool  = +document.getElementById('coolMin').value * 60;
  var peak  = +document.getElementById('peakRpm').value;
  var start = +document.getElementById('startRpm').value || Math.round(peak * 0.8);
  var endRpm = +document.getElementById('endRpm').value || Math.round(peak * 0.8);
  var c = { warmSec: warm, peakSec: total - warm - cool, coolSec: cool, peakRpm: peak, startRpm: start };
  var denom = peak - start * 0.8 + 1;

  ctx.clearRect(0, 0, W, H);
  var grad = ctx.createLinearGradient(0, 0, W, 0);
  grad.addColorStop(0, 'rgba(255,140,66,0.3)');
  grad.addColorStop(warm / total, 'rgba(232,245,61,0.3)');
  grad.addColorStop(1, 'rgba(66,184,255,0.3)');

  ctx.beginPath();
  for (var x = 0; x <= W; x++) {
    var rpm = getRpmAt((x / W) * total, c);
    var y = H - ((rpm - start * 0.8) / denom) * (H - 6);
    if (x === 0) { ctx.moveTo(x, H); }
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.beginPath();
  ctx.strokeStyle = '#e8f53d';
  ctx.lineWidth = 2;
  for (var x2 = 0; x2 <= W; x2++) {
    var rpm2 = getRpmAt((x2 / W) * total, c);
    var y2 = H - ((rpm2 - start * 0.8) / denom) * (H - 6);
    if (x2 === 0) { ctx.moveTo(x2, y2); } else { ctx.lineTo(x2, y2); }
  }
  ctx.stroke();

  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  [warm / total * W, (total - cool) / total * W].forEach(function(xd) {
    ctx.beginPath(); ctx.moveTo(xd, 0); ctx.lineTo(xd, H); ctx.stroke();
  });
  ctx.setLineDash([]);
}

(function() {
  var saved = JSON.parse(localStorage.getItem('spinConfig') || '{}');
  var defaults = { peakRpm: 80, totalMin: 30, warmMin: 5, coolMin: 5, startRpm: 56 };

  var savedVol = localStorage.getItem('beatVolume');
  if (savedVol !== null) {
    beatVolume = toLogVolume(savedVol);
    document.getElementById('beatVolume').value = savedVol;
    document.getElementById('volVal').textContent = savedVol;
    document.getElementById('beatVolumeW').value = savedVol;
    document.getElementById('volValW').textContent = savedVol;
  }
})();

// 入力変更時に設定を保存
function saveConfig() {
  var config = {};
  ['peakRpm','totalMin','warmMin','coolMin','startRpm','endRpm'].forEach(function(id) {
    config[id] = +document.getElementById(id).value;
  });
  localStorage.setItem('spinConfig', JSON.stringify(config));
}

['peakRpm','totalMin','warmMin','coolMin','startRpm','endRpm'].forEach(function(id) {
  document.getElementById(id).addEventListener('input', function() {
    if (id === 'peakRpm') {
      var peak = +document.getElementById('peakRpm').value;
      document.getElementById('startRpm').value = Math.round(peak * 0.8);
      document.getElementById('endRpm').value = Math.round(peak * 0.8);
    }
    drawRamp();
    saveConfig();
  });
});
drawRamp();

function startWorkout() {
  initAudio();
  // ワークアウト画面のビートボタンをセットアップ画面と同期
  document.querySelectorAll('#beatToggleW .beat-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.val === beatMode);
  });
  var peakRpm  = +document.getElementById('peakRpm').value;
  var totalMin = +document.getElementById('totalMin').value;
  var warmMin  = +document.getElementById('warmMin').value;
  var coolMin  = +document.getElementById('coolMin').value;
  var warmSec  = warmMin * 60;
  var coolSec  = coolMin * 60;
  totalSec = totalMin * 60;
  var peakSec  = totalSec - warmSec - coolSec;

  if (peakSec <= 0) { alert('合計時間がウォームアップ+クールダウンより短いです'); return; }

  cfg = { peakRpm: peakRpm, totalMin: totalMin, warmSec: warmSec, peakSec: peakSec, coolSec: coolSec, startRpm: +document.getElementById('startRpm').value || Math.round(peakRpm * 0.8), endRpm: +document.getElementById('endRpm').value || Math.round(peakRpm * 0.8) };
  elapsed = 0;
  paused = false;

  document.getElementById('phWarmVal').textContent = warmMin + 'min';
  document.getElementById('phPeakVal').textContent = Math.round(peakSec / 60) + 'min';
  document.getElementById('phCoolVal').textContent = coolMin + 'min';
  document.getElementById('pauseBtn').textContent = 'PAUSE';

  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('workout-screen').style.display = 'flex';

  tick();
  timerInterval = setInterval(tick, 1000);
  orbitAngle = 0;
  flashCount = 0;
  updateOrbit();
  scheduleBeat();
}

function tick() {
  if (paused) return;
  var rpm = Math.round(getRpmAt(elapsed, cfg));
  var remaining = totalSec - elapsed;
  var rm = Math.floor(remaining / 60);
  var rs = Math.floor(remaining % 60);
  var em = Math.floor(elapsed / 60);
  var es = Math.floor(elapsed % 60);

  document.getElementById('timeRemaining').textContent = rm + ':' + (rs < 10 ? '0' : '') + rs;
  document.getElementById('elapsedLabel').textContent = em + ':' + (es < 10 ? '0' : '') + es + ' 経過';
  document.getElementById('rpmBig').textContent = rpm;
  document.getElementById('beatRpmInner').textContent = rpm;
  document.getElementById('secInterval').textContent = (60 / rpm).toFixed(1);
  document.getElementById('rampBar').style.width = (elapsed / totalSec * 100) + '%';

  document.querySelectorAll('.phase-block').forEach(function(b) { b.classList.remove('active-phase'); });

  var badge = document.getElementById('phaseBadge');
  var rpmEl = document.getElementById('rpmBig');
  var bar   = document.getElementById('rampBar');

  if (elapsed < cfg.warmSec) {
    badge.className = 'phase-badge warmup';
    badge.textContent = 'WARM UP';
    rpmEl.style.color = 'var(--warm)';
    bar.style.background = 'var(--warm)';
    document.getElementById('phaseWarm').classList.add('active-phase');
  } else if (elapsed < cfg.warmSec + cfg.peakSec) {
    badge.className = 'phase-badge peak';
    badge.textContent = 'PEAK';
    rpmEl.style.color = 'var(--accent)';
    bar.style.background = 'var(--accent)';
    document.getElementById('phasePeak').classList.add('active-phase');
  } else {
    badge.className = 'phase-badge cooldown';
    badge.textContent = 'COOL DOWN';
    rpmEl.style.color = 'var(--cool)';
    bar.style.background = 'var(--cool)';
    document.getElementById('phaseCool').classList.add('active-phase');
  }

  elapsed++;
  if (elapsed > totalSec) { finishWorkout(); }
}

function backToSetup() {
  stopWorkout();
  document.getElementById('setup-screen').style.display = '';
  document.getElementById('workout-screen').style.display = 'none';
  document.getElementById('history-screen').style.display = 'none';
}

function showHistory() {
  document.getElementById('history-screen').style.display = '';
  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('workout-screen').style.display = 'none';
}

function clearAllHistory() {
  localStorage.removeItem('spinHistory');
  document.getElementById('histList').innerHTML = '';
  closeConfirm();
}

function closeConfirm() {
  var el = document.querySelector('.confirm-overlay');
  if (el) el.style.display = 'none';
}

function finishWorkout() {
  stopWorkout();
  playFinishMusic();
}

function playSound() {
  if (beatMode === 'off' || !audioCtx) return;
  var o = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  o.connect(g);
  g.connect(audioCtx.destination);
  if (beatMode === 'click') {
    o.type = 'square';
    o.frequency.setValueAtTime(1200, audioCtx.currentTime);
    g.gain.setValueAtTime(beatVolume * 0.6, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
    o.start(audioCtx.currentTime);
    o.stop(audioCtx.currentTime + 0.04);
  } else {
    o.type = 'sine';
    o.frequency.setValueAtTime(880, audioCtx.currentTime);
    g.gain.setValueAtTime(beatVolume * 0.8, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
    o.start(audioCtx.currentTime);
    o.stop(audioCtx.currentTime + 0.12);
  }
}

function flashRing() {
  var ring = document.getElementById('beatRing');
  ring.classList.remove('pulse');
  void ring.offsetWidth;
  ring.classList.add('pulse');
}

function resumeAudioIfNeeded() {
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

var orbitAngle = 0;
var orbitRaf = null;
var orbitLastTime = null;

function updateOrbit() {
  orbitLastTime = null;
  function step(ts) {
    if (paused) { orbitRaf = requestAnimationFrame(step); return; }
    if (orbitLastTime !== null) {
      var rpm = getRpmAt(elapsed, cfg);
      var degsPerMs = (rpm * 360) / 60000;
      var prevAngle = orbitAngle;
      orbitAngle = (orbitAngle + degsPerMs * (ts - orbitLastTime)) % 360;
      // 12時通過時（0度をまたいだとき）にflash
      if (prevAngle > orbitAngle) flashRing();
      var ring = document.getElementById('orbitRing');
      if (ring) {
        var a = orbitAngle;
        var tail = 120; // 尾の長さ（度）
        var start = (a - tail + 360) % 360;
        ring.style.background =
          'conic-gradient(from ' + start + 'deg, ' +
          'transparent 0deg, ' +
          'rgba(255,80,0,0.15) 10deg, ' +
          'rgba(255,120,0,0.4) 25deg, ' +
          'rgba(255,180,0,0.7) 50deg, ' +
          'rgba(232,245,61,0.9) 80deg, ' +
          '#fff 100deg, ' +
          'rgba(232,245,61,0.9) ' + (tail - 5) + 'deg, ' +
          'transparent ' + tail + 'deg)';
      }
    }
    orbitLastTime = ts;
    orbitRaf = requestAnimationFrame(step);
  }
  orbitRaf = requestAnimationFrame(step);
}

function stopOrbit() {
  if (orbitRaf) cancelAnimationFrame(orbitRaf);
  orbitRaf = null;
  orbitAngle = 0;
  var ring = document.getElementById('orbitRing');
  if (ring) ring.style.background = 'conic-gradient(transparent 0deg, transparent 360deg)';
}

var flashCount = 0;

function scheduleBeat() {
  if (paused) return;
  resumeAudioIfNeeded();
  var rpm = getRpmAt(elapsed, cfg);
  var interval = (60 / rpm / 2) * 1000; // 0.5RPM間隔（音）
  if (beatMode !== 'off') playSound();
  // 光はorbitアニメーション側で12時通過時に発火
  beatTimeout = setTimeout(scheduleBeat, interval);
}

function togglePause() {
  paused = !paused;
  document.getElementById('pauseBtn').textContent = paused ? 'RESUME' : 'PAUSE';
  if (!paused) { initAudio(); updateOrbit(); scheduleBeat(); } else { clearTimeout(beatTimeout); stopOrbit(); }
}

function stopWorkout() {
  clearInterval(timerInterval);
  clearTimeout(beatTimeout);
  stopOrbit();
  stopFinishMusic();
  document.getElementById('workout-screen').style.display = 'none';
  document.getElementById('setup-screen').style.display = 'flex';
  drawRamp();
}

var finishMusicTimeout = null;



window.addEventListener('resize', drawRamp);

document.addEventListener('touchstart', function onFirstTouch() {
  initAudio();
  document.removeEventListener('touchstart', onFirstTouch);
}, { once: true });

// YouTube等で音声が止まった後、画面タップで自動再開
document.addEventListener('touchstart', function() {
  resumeAudioIfNeeded();
}, { passive: true });
</script>
